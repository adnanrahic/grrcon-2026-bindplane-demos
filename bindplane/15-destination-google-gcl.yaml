# Google Cloud Logging for the appjson stream. NOT the account's shared
# Google-GCL: that one is terraform-managed and uses auth_type: auto, which
# resolves ADC from the environment -- absent here -- so its exporter fails to
# START rather than failing softly like Dynatrace's 404.
#
# auth_type: file reads the same mocked key the chronicle exporter uses.
# auth_type: json would take the key inline, i.e. a private key in tracked YAML;
# credentials.json is gitignored to prevent that.
#
# The key is a mock, so export fails at request time -- the pipeline still RUNS,
# which is the point. `project` matches the mocked key's own project_id.
#
# Numbered 15 so it applies before 20-source-appjson.yaml and 40-gateway.yaml.
#
# NOTE: needs credentials.json at /opt/credentials.json on every collector using
# it -- bdot-appjson plus bdot-01..10.
---
apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: grrcon-google-gcl
spec:
  type: googlecloud
  parameters:
  - name: telemetry_types
    value:
    - Logs
  - name: project
    value: grrcon-demo
  - name: auth_type
    value: file
  - name: credentials_file
    value: /opt/credentials.json
