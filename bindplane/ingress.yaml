# The ingress is the native ingestion point for the whole demo: OTLP plus all
# five native sources (two tailing files, three listening on tcp). EVERYTHING
# leaves through the Bindplane Gateway destination to bdot-pool -- the worker
# tier does the fan-out to the real backends via its routing connector.
#
# These Source resources are shared with the five edge collectors, which keep
# their own direct-to-destination pipelines. Two collectors tailing one file is
# fine (each keeps its own checkpoint); the tcp sources here stay idle unless a
# generator targets the ingress, since blitz has one output per process.
---
apiVersion: bindplane.observiq.com/v1
kind: Source
metadata:
  name: grrcon-otlp-in
spec:
  type: otlp
  parameters:
  - name: telemetry_types
    value:
    - Logs
    - Metrics
    - Traces
  - name: listen_address
    value: 0.0.0.0
  - name: grpc_port
    value: 4317
  - name: http_port
    value: 4318
  - name: enable_tls
    value: false
---
apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: grrcon-worker-pool
spec:
  type: bindplane_gateway
  parameters:
  - name: hostname
    value: bdot-pool
  - name: protocol
    value: grpc
  - name: grpc_port
    value: 4317
  - name: enable_tls
    value: false
  - name: grpc_compression
    value: gzip
  - name: enable_grpc_load_balancing
    value: true
  - name: grpc_load_balancing_policy
    value: round_robin
  - name: retry_on_failure_enabled
    value: true
---
apiVersion: bindplane.observiq.com/v2
kind: Configuration
metadata:
  name: grrcon-ingress
  labels:
    platform: linux
spec:
  sources:
  - name: grrcon-otlp-in
    routes:
      logs:
      - id: '0'
        components:
        - destinations/d-grrcon-worker-pool
      metrics:
      - id: m0
        components:
        - destinations/d-grrcon-worker-pool
      traces:
      - id: t0
        components:
        - destinations/d-grrcon-worker-pool
  - id: s-grrcon-apache-in
    name: grrcon-apache-in
    routes:
      logs:
      - id: '1'
        components:
        - destinations/d-grrcon-worker-pool
  - id: s-grrcon-cef-in
    name: grrcon-cef-in
    routes:
      logs:
      - id: '2'
        components:
        - destinations/d-grrcon-worker-pool
  - id: s-grrcon-panos-in
    name: grrcon-panos-in
    routes:
      logs:
      - id: '3'
        components:
        - destinations/d-grrcon-worker-pool
  - id: s-grrcon-appjson-in
    name: grrcon-appjson-in
    routes:
      logs:
      - id: '4'
        components:
        - destinations/d-grrcon-worker-pool
  - id: s-grrcon-winsec-in
    name: grrcon-winsec-in
    routes:
      logs:
      - id: '5'
        components:
        - destinations/d-grrcon-worker-pool
  destinations:
  - id: d-grrcon-worker-pool
    name: grrcon-worker-pool
