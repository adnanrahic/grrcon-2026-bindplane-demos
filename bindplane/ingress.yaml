# Front door: accepts OTLP from anything on the host, fans it out across the
# 10-worker pool. Assigned to bdot-ingress via its `configuration=grrcon-ingress`
# OpAMP label, so it self-assigns the moment the container registers.
apiVersion: bindplane.observiq.com/v1
kind: Source
metadata:
  name: grrcon-otlp-in
spec:
  type: otlp
  parameters:
    - name: telemetry_types
      value:
        - Logs
        - Metrics
        - Traces
    - name: listen_address
      value: "0.0.0.0"
    - name: grpc_port
      value: 4317
    - name: http_port
      value: 4318
    - name: enable_tls
      value: false
---
# RFC 5424 syslog on 5140/udp. Every blitz stream arrives here with a distinct
# APPNAME, which the collector parses into an attribute -- that attribute is what
# the worker-tier routing connector splits on. OTLP stays enabled alongside it
# for anything that speaks OTLP natively.
apiVersion: bindplane.observiq.com/v1
kind: Source
metadata:
  name: grrcon-syslog-in
spec:
  type: syslog
  parameters:
    - name: listen_ip
      value: "0.0.0.0"
    - name: listen_port
      value: 5140
    - name: protocol
      value: rfc3164
    - name: connection_type
      value: udp
    # Parse the RFC fields into ATTRIBUTES, leaving the body as the raw log
    # line exactly as the source emitted it (Windows Event XML, PAN-OS CSV,
    # CEF, Apache access log). Bindplane Blueprints match on that raw shape;
    # the default (`body`) rewrites the body into a map of syslog parts and
    # no blueprint matches it.
    - name: parse_to
      value: attributes
---
# `bdot-pool` is a Docker network alias shared by all 10 workers, so this one
# hostname resolves to 10 container IPs. enable_grpc_load_balancing makes the
# client spread connections across every resolved address instead of pinning
# to whichever IP it saw first -- without it, one worker takes all the traffic.
apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: grrcon-worker-pool
spec:
  type: bindplane_gateway
  parameters:
    - name: hostname
      value: bdot-pool
    - name: protocol
      value: grpc
    - name: grpc_port
      value: 4317
    - name: enable_tls
      value: false
    - name: grpc_compression
      value: gzip
    - name: enable_grpc_load_balancing
      value: true
    - name: grpc_load_balancing_policy
      value: round_robin
    - name: retry_on_failure_enabled
      value: true
---
# The syslog parser puts the RFC fields in attributes (parse_to: attributes) but
# leaves the body as the WHOLE raw line, syslog header and all:
#     <14>Sep  2 11:06:53 siem-edge-01 cef[pid42]: CEF:0|Enterprise|SIEM|...
# Bindplane Blueprints match the bare payload, not a syslog-wrapped one. The
# parser already extracted that payload into attributes["message"], so promote
# it to the body and drop the now-duplicated attribute. Result:
#     body       = CEF:0|Enterprise|SIEM|...        (what blueprints match)
#     attributes = appname, hostname, facility, priority, proc_id
apiVersion: bindplane.observiq.com/v1
kind: Processor
metadata:
  name: grrcon-syslog-unwrap
spec:
  type: custom
  parameters:
    - name: telemetry_types
      value:
        - Logs
    - name: configuration
      value: |-
        transform:
          error_mode: ignore
          log_statements:
            - context: log
              statements:
                - set(body, attributes["message"]) where attributes["message"] != nil
                - delete_key(attributes, "message")

---
# Raw TCP for PAN-OS CSV. Bindplane has no palo_alto source type; its Palo Alto
# blueprint uses generic tcp/udp sources and does the parsing downstream, so
# this is the sanctioned path rather than a workaround.
#
# parse_format: none on purpose -- the blueprint's first processor strips the
# syslog header itself. log_type is what the worker-tier router matches on,
# which is the idiomatic Bindplane routing key (every source exposes it) and
# replaces the appname coupling for this stream.
apiVersion: bindplane.observiq.com/v1
kind: Source
metadata:
  name: grrcon-panos-in
spec:
  type: tcp
  parameters:
    - name: listen_ip
      value: "0.0.0.0"
    - name: listen_port
      value: 5141
    - name: log_type
      value: palo-alto
    - name: parse_format
      value: none
---
apiVersion: bindplane.observiq.com/v2
kind: Configuration
metadata:
  name: grrcon-ingress
  labels:
    platform: linux
spec:
  sources:
    - name: grrcon-otlp-in
    - name: grrcon-syslog-in
      processors:
        - name: grrcon-syslog-unwrap
    - name: grrcon-panos-in
  destinations:
    - name: grrcon-worker-pool
