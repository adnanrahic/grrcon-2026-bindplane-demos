# The ingress now carries OTLP only. Each blitz stream lands on its own edge
# collector instead (see bindplane/edge-*.yaml), so the syslog and PAN-OS TCP
# sources that used to live here retired along with the gateway log path. The
# worker pool and routing connector still register, but carry no blitz traffic.
---
apiVersion: bindplane.observiq.com/v1
kind: Source
metadata:
  name: grrcon-otlp-in
spec:
  type: otlp
  parameters:
  - name: telemetry_types
    value:
    - Logs
    - Metrics
    - Traces
  - name: listen_address
    value: 0.0.0.0
  - name: grpc_port
    value: 4317
  - name: http_port
    value: 4318
  - name: enable_tls
    value: false
---
apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: grrcon-worker-pool
spec:
  type: bindplane_gateway
  parameters:
  - name: hostname
    value: bdot-pool
  - name: protocol
    value: grpc
  - name: grpc_port
    value: 4317
  - name: enable_tls
    value: false
  - name: grpc_compression
    value: gzip
  - name: enable_grpc_load_balancing
    value: true
  - name: grpc_load_balancing_policy
    value: round_robin
  - name: retry_on_failure_enabled
    value: true
---
apiVersion: bindplane.observiq.com/v2
kind: Configuration
metadata:
  name: grrcon-ingress
  labels:
    platform: linux
spec:
  sources:
  - name: grrcon-otlp-in
  destinations:
  - name: grrcon-worker-pool
