# Routing connector: splits the merged worker-tier log stream back into its five
# original sources and sends each to its own destination.
#
# Why attributes["appname"]:
# The ingress syslog source sets `parse_to: attributes`, so the parsed RFC
# fields (appname, hostname, facility, priority, ...) land in attributes and the
# body is left as the raw log line the generator emitted. That raw body is what
# Bindplane Blueprints match on.
#
# With the source default (`parse_to: body`) the parsed fields are moved INTO
# the body instead, and the condition would need to be body["appname"]. If you
# change parse_to, change these conditions to match -- a mismatch matches
# nothing silently and everything falls through to the catch-all.
#
# Each APPNAME is set per generator in docker-compose.blitz.yaml. OTLP could not
# carry this distinction: blitz hardcodes service.name="blitz" on OTLP output
# with no override, so all five streams arrived identical. Syslog is what makes
# them separable.
#
# Routes are FIRST MATCH WINS, so the unconditioned catch-all must stay last.
# Anything landing in `unmatched` means a stream's appname changed or a new
# generator was added without a route -- watch the debug destination for it.
apiVersion: bindplane.observiq.com/v1
kind: Connector
metadata:
  name: grrcon-router
spec:
  type: routing
  parameters:
    - name: telemetry_types
      value:
        - Logs
    - name: routes
      value:
        - condition:
            ottl: attributes["appname"] == "winsec"
            ui:
              operator: ""
              statements:
                - key: appname
                  match: attributes
                  operator: Equals
                  value: winsec
          id: winsec
        - condition:
            ottl: attributes["appname"] == "paloalto"
            ui:
              operator: ""
              statements:
                - key: appname
                  match: attributes
                  operator: Equals
                  value: paloalto
          id: paloalto
        - condition:
            ottl: attributes["appname"] == "appjson"
            ui:
              operator: ""
              statements:
                - key: appname
                  match: attributes
                  operator: Equals
                  value: appjson
          id: appjson
        - condition:
            ottl: attributes["appname"] == "apache"
            ui:
              operator: ""
              statements:
                - key: appname
                  match: attributes
                  operator: Equals
                  value: apache
          id: apache
        - condition:
            ottl: attributes["appname"] == "cef"
            ui:
              operator: ""
              statements:
                - key: appname
                  match: attributes
                  operator: Equals
                  value: cef
          id: cef
        - id: unmatched
