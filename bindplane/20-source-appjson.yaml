# Mixed-format JSON app logs -> Dynatrace.
#
# parse_format is deliberately `none`: the body arrives as a RAW JSON string,
# not a parsed map. The tcp source can parse it natively (parse_format: json
# renders a json_parser with parse_to: body), but leaving it unparsed is the
# point -- this stream is the one no blueprint covers, so it is where adding
# parsing processors by hand is worth demonstrating.
#
# log_type is still stamped as an attribute by a separate `add` operator, so
# the gateway router keeps matching attributes["log_type"] == "appjson".
---
apiVersion: bindplane.observiq.com/v1
kind: Source
metadata:
  name: grrcon-appjson-in
spec:
  type: tcp
  parameters:
  - name: listen_ip
    value: 0.0.0.0
  - name: listen_port
    value: 5143
  - name: log_type
    value: appjson
  - name: parse_format
    value: none
---
apiVersion: bindplane.observiq.com/v2
kind: Configuration
metadata:
  name: grrcon-appjson
  labels:
    agent-type: observiq-otel-collector
    platform: linux
spec:
  sources:
  - id: s-grrcon-appjson-in
    name: grrcon-appjson-in
    routes:
      logs:
      - id: '0'
        components:
        - destinations/d-Dynatrace
  destinations:
  - id: d-Dynatrace
    name: Dynatrace
