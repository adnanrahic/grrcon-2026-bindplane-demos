---
apiVersion: bindplane.observiq.com/v1
kind: Source
metadata:
  name: grrcon-gateway-in
spec:
  type: bindplane_gateway
  parameters:
  - name: telemetry_types
    value:
    - Logs
  - name: listen_address
    value: 0.0.0.0
  - name: grpc_port
    value: 4317
  - name: http_port
    value: 4318
  - name: enable_tls
    value: false
---
apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: grrcon-debug-out
spec:
  type: custom
  parameters:
  - name: telemetry_types
    value:
    - Logs
    - Metrics
    - Traces
  - name: configuration
    value: |-
      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200
---
apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: Splunk-HEC
spec:
  type: splunkhec_v2
  parameters:
  - name: telemetry_types
    value:
    - Logs
  - name: hostname
    value: REPLACE_ME.splunkcloud.com
  - name: port
    value: 8088
  - name: path
    value: "/services/collector/event"
  - name: token
    value: REPLACE_ME
  - name: index_logs
    value: main
---
apiVersion: bindplane.observiq.com/v2
kind: Configuration
metadata:
  name: grrcon-gateway
  labels:
    platform: linux
spec:
  sources:
  - id: s-grrcon-gateway-in
    name: grrcon-gateway-in
    routes:
      logs:
      - id: '0'
        components:
        - connectors/c-grrcon-router
  connectors:
  - id: c-grrcon-router
    name: grrcon-router
    routes:
      logs:
      - id: winsec
        components:
        - destinations/d-Google-SecOps-Linux
      - id: paloalto
        components:
        - destinations/d-Dynatrace
      - id: appjson
        components:
        - destinations/d-Dynatrace
      - id: apache
        components:
        - destinations/d-Elastic
      - id: cef
        components:
        - destinations/d-Splunk-HEC
      - id: unmatched
        components:
        - destinations/d-grrcon-debug-out
  destinations:
  - id: d-Google-SecOps-Linux
    name: Google-SecOps-Linux
  - id: d-Dynatrace
    name: Dynatrace
  - id: d-Elastic
    name: Elastic
  - id: d-Splunk-HEC
    name: Splunk-HEC
  - id: d-grrcon-debug-out
    name: grrcon-debug-out
  # Progressive rollout: new versions reach env=canary (bdot-01, bdot-02) first,
  # then env=prod (bdot-03..10), pausing on the first collector error.
  #
  # This is label-based staging, which `bindplane rollout start` cannot express
  # -- its flags (--initial/--multiplier/--max) only phase by COUNT. The staging
  # lives on the configuration resource instead, so it applies to every rollout
  # of this config however it is triggered.
  #
  # phaseAgentCount type: adaptive lets the server size each phase from the
  # collector count; initial/multiplier/maximum are ignored in that mode.
  rollout:
    type: progressive
    parameters:
    - name: stages
      value:
      - name: Canary
        labels:
          env: canary
      - name: Prod
        labels:
          env: prod
    - name: maxErrors
      value: 0
    - name: phaseAgentCount
      value:
        type: adaptive
        initial: 0
        multiplier: 0
        maximum: 0
