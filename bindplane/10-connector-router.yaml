# Files in this directory are numbered because `bindplane apply -f bindplane/`
# processes them in filename order, and resources must exist before anything
# references them. Alphabetical order broke this twice:
#   - a Connector must be applied before the Configuration using it, otherwise
#     apply fails with "unknown Connector"
#   - the five Sources must exist before 30-edge.yaml, which references them,
#     otherwise apply fails with "unknown Source"
# Both only surface against a FRESH account -- with the resources already
# present, a wrong order silently works.
#
#   10 connector -> 20 sources -> 30 edge -> 40 gateway -> 50 fleets
#
# Routing connector: splits the merged worker-tier log stream back into its five
# original sources and sends each to its own destination.
#
# Why the conditions differ per route:
# Every native source stamps a `log_type`, but not all in the same place.
#   - tcp sources (winsec, panos, appjson) set it as an ATTRIBUTE
#   - common_event_format sets it as an ATTRIBUTE
#   - apache_common regex-parses INTO THE BODY, so its log_type is a body field
#     and the only attribute on the record is log.file.name
# Hence body["log_type"] for apache and attributes["log_type"] for the rest.
# A mismatch matches nothing silently and everything lands in the catch-all,
# which grrcon-gateway no longer wires to a destination -- so the records are
# discarded via a synthesised nop pipeline. The branch is still
# throughput-measured, so the Bindplane UI still shows the misroute; you just
# cannot read the offending records. See "Detecting a misroute without the
# catch-all sink" in .claude/50-routing.md.
#
# Each APPNAME is set per generator in docker-compose.blitz.yaml. OTLP could not
# carry this distinction: blitz hardcodes service.name="blitz" on OTLP output
# with no override, so all five streams arrived identical. Syslog is what makes
# them separable.
#
# Routes are FIRST MATCH WINS, so the unconditioned catch-all must stay last.
# The `unmatched` route id below is still declared, but grrcon-gateway no longer
# maps it to a destination. Bindplane then renders it as
# throughputmeasurement -> forward -> nop, so unmatched records are discarded
# while the branch stays measurable. Keeping the id means a debug sink can be
# wired back in for a session without editing this connector.
apiVersion: bindplane.observiq.com/v1
kind: Connector
metadata:
  name: grrcon-router
spec:
  type: routing
  parameters:
    - name: telemetry_types
      value:
        - Logs
    - name: routes
      value:
        - condition:
            ottl: attributes["log_type"] == "windows_event.security"
            ui:
              operator: ""
              statements:
                - key: log_type
                  match: attributes
                  operator: Equals
                  value: windows_event.security
          id: winsec
        - condition:
            ottl: attributes["log_type"] == "palo-alto"
            ui:
              operator: ""
              statements:
                - key: log_type
                  match: attributes
                  operator: Equals
                  value: palo-alto
          id: paloalto
        - condition:
            ottl: attributes["log_type"] == "appjson"
            ui:
              operator: ""
              statements:
                - key: log_type
                  match: attributes
                  operator: Equals
                  value: appjson
          id: appjson
        - condition:
            ottl: attributes["log_type"] == "cef"
            ui:
              operator: ""
              statements:
                - key: log_type
                  match: attributes
                  operator: Equals
                  value: cef
          id: cef
        - condition:
            ottl: body["log_type"] == "apache_common"
            ui:
              operator: ""
              statements:
                - key: log_type
                  match: body
                  operator: Equals
                  value: apache_common
          id: apache
        - id: unmatched
