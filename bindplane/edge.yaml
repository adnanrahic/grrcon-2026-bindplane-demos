# The native-format path, kept deliberately separate from the syslog pipeline.
#
# Bindplane's format-specific log sources -- apache_common, apache_combined,
# nginx, common_event_format, csv, w3c, iis -- all render to a `file_log`
# receiver. They TAIL FILES and have no listener mode, so nothing can push to
# them over the network. blitz writes the file (native apache-common generator
# + `file` output, which does not mutate the line) and this collector tails it.
#
# This configuration goes STRAIGHT to Elastic rather than through the worker
# pool, so adding it cannot disturb the ingress, the workers, or the routing
# connector. Pairs with the `elasticsearch-apache-common-full-pipeline`
# blueprint if you want the full parse/reduce/enrich treatment.
apiVersion: bindplane.observiq.com/v1
kind: Fleet
metadata:
  name: grrcon-edge
  labels:
    platform: linux
    agent-type: observiq-otel-collector
spec:
  configuration: ""
  selector:
    matchLabels:
      fleet: grrcon-edge
---
# `file_path` is the EXACT file, not a glob. lumberjack rotates to siblings like
# access-2026-09-02T....log; a glob would tail those too and re-read history.
apiVersion: bindplane.observiq.com/v1
kind: Source
metadata:
  name: grrcon-apache-in
spec:
  type: apache_common
  parameters:
    - name: file_path
      value:
        - /logs/apache/access.log
    - name: start_at
      value: end
    - name: parse
      value: true
---
apiVersion: bindplane.observiq.com/v2
kind: Configuration
metadata:
  name: grrcon-apache
  labels:
    platform: linux
spec:
  sources:
    - id: s-grrcon-apache-in
      name: grrcon-apache-in
      routes:
        logs:
          - id: "0"
            components:
              - destinations/d-Elastic
  destinations:
    - id: d-Elastic
      name: Elastic
