# The ingress is the native ingestion point: two file-tailing sources and three
# tcp listeners. Everything leaves through the Bindplane Gateway destination to
# bdot-pool -- the worker tier fans out to the real backends via its routing
# connector.
#
# Logs only. The OTLP source was removed once nothing used it; the native
# sources here are all logs-only, so this tier carries no metrics or traces.
# Re-adding OTLP means restoring its source, the 4317/4318 ports on the
# container, and the metrics/traces routes on the worker gateway source.
#
# These Source resources are shared with the five edge collectors, which keep
# their own direct-to-destination pipelines.
---
apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: grrcon-worker-pool
spec:
  type: bindplane_gateway
  parameters:
  - name: hostname
    value: bdot-pool
  - name: protocol
    value: grpc
  - name: grpc_port
    value: 4317
  - name: enable_tls
    value: false
  - name: grpc_compression
    value: gzip
  - name: enable_grpc_load_balancing
    value: true
  - name: grpc_load_balancing_policy
    value: round_robin
  - name: retry_on_failure_enabled
    value: true
---
apiVersion: bindplane.observiq.com/v2
kind: Configuration
metadata:
  name: grrcon-edge
  labels:
    platform: linux
spec:
  sources:
  - id: s-grrcon-apache-in
    name: grrcon-apache-in
    routes:
      logs:
      - id: '0'
        components:
        - destinations/d-grrcon-worker-pool
  - id: s-grrcon-cef-in
    name: grrcon-cef-in
    routes:
      logs:
      - id: '1'
        components:
        - destinations/d-grrcon-worker-pool
  - id: s-grrcon-panos-in
    name: grrcon-panos-in
    routes:
      logs:
      - id: '2'
        components:
        - destinations/d-grrcon-worker-pool
  - id: s-grrcon-appjson-in
    name: grrcon-appjson-in
    routes:
      logs:
      - id: '3'
        components:
        - destinations/d-grrcon-worker-pool
  - id: s-grrcon-winsec-in
    name: grrcon-winsec-in
    routes:
      logs:
      - id: '4'
        components:
        - destinations/d-grrcon-worker-pool
  destinations:
  - id: d-grrcon-worker-pool
    name: grrcon-worker-pool
