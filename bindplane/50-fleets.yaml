# Seven fleets: grrcon-edge (10), grrcon-gateway (10), and one per source
# collector (1 each). A collector can belong to exactly one fleet at a time --
# an agent carries a single resolved `fleet` field, not a list -- so a collector
# is *moved* between fleets rather than added to a second one. `fleet=` is the
# one label on these collectors that is mutually exclusive.
#
# `role=` is NOT mutually exclusive and is deliberately left alone: all five
# source collectors keep `role=source`, so `--selector role=source` still
# addresses the tier as a whole now that it has no single fleet.
#
# Membership is driven from the collector side: each container reports a
# `fleet=` OpAMP label (see docker-compose.yaml) and the selector below claims
# every collector carrying it.
apiVersion: bindplane.observiq.com/v1
kind: Fleet
metadata:
  name: grrcon-gateway
  labels:
    platform: linux
    agent-type: observiq-otel-collector
spec:
  configuration: ""
  selector:
    matchLabels:
      fleet: grrcon-gateway
---
# The edge tier sits alone here so it can be operated -- upgraded, restarted,
# rolled -- without touching the worker pool, and so fleet-wide actions aimed
# at the workers can never reach the front door.
apiVersion: bindplane.observiq.com/v1
kind: Fleet
metadata:
  name: grrcon-edge
  labels:
    platform: linux
    agent-type: observiq-otel-collector
spec:
  configuration: ""
  selector:
    matchLabels:
      fleet: grrcon-edge
---
# The source tier: one collector per source+destination pipeline, and now one
# FLEET per collector too, so each source can be upgraded, restarted or rolled
# entirely on its own.
#
# Unlike the two tier fleets above, these set `spec.configuration`. That is a
# second path assigning a pipeline alongside each collector's `configuration=`
# label -- safe only because both name the SAME configuration for a given
# collector, so the two can never disagree. Renaming one without the other is
# what would break it.
apiVersion: bindplane.observiq.com/v1
kind: Fleet
metadata:
  name: grrcon-source-apache
  labels:
    platform: linux
    agent-type: observiq-otel-collector
spec:
  configuration: grrcon-apache
  selector:
    matchLabels:
      fleet: grrcon-source-apache
---
