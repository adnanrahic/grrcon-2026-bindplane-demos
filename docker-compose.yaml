# GrrCON demo: a Bindplane-managed gateway topology.
#
#   blitz (tcp 5141-5143 + tailed files) -> bdot-edge-01..10
#                                        -> bdot-pool:4317 -> one of bdot-01..10
#
# All 25 collectors are managed from Bindplane Cloud over OpAMP; nothing here
# defines a pipeline. Pipelines live in bindplane/ and are applied separately.
# Three tiers: 10 edge (grrcon-edge), 10 gateway (grrcon-gateway), 5 per-source
# (one grrcon-source-* fleet each, straight to a backend).
#
# The 10 workers share the network alias `bdot-pool`. Docker's embedded DNS
# returns all 10 container IPs for that one name, so the edge destination
# points at a single hostname with gRPC load balancing on and the pool can grow
# or shrink without touching the Bindplane config.
#
# Only the five source-tier collectors publish ports (5141-5143). The edge and
# worker tiers listen inside bdot-net only. There is no host-published OTLP
# entry point: the OTLP source was removed once nothing used it.

x-bdot: &bdot
  image: ghcr.io/observiq/bindplane-agent:${BDOT_VERSION:-1.106.0}
  restart: unless-stopped

x-bdot-env: &bdot-env
  OPAMP_ENDPOINT: ${OPAMP_ENDPOINT:-wss://app.bindplane.com/v1/opamp}
  OPAMP_SECRET_KEY: ${BINDPLANE_SECRET_KEY:?set BINDPLANE_SECRET_KEY in .env -- copy .env.example}
  MANAGER_YAML_PATH: /etc/otel/storage/manager.yaml

networks:
  bdot-net:
    name: bdot-net

services:
  # ---------------------------------------------------------------------------
  # EDGE TIER -- ten collectors simulating edge hosts. All run the SAME
  # configuration (grrcon-edge): two file-tailing sources plus three tcp
  # listeners, everything forwarded to the gateway pool.
  #
  # They share the `bdot-edge-pool` network alias so the blitz *-gw generators
  # can address the tier by one name. No published ports: 5141-5143 belong to
  # the source tier on the host, and ten collectors cannot each publish 13133.
  #
  # NOTE: all ten tail the SAME two files, so the apache and cef streams are
  # ingested ten times over. That is inherent to running one file-tailing
  # configuration on ten collectors -- see the README.
  # ---------------------------------------------------------------------------

  bdot-edge-01:
    <<: *bdot
    container_name: bdot-edge-01
    hostname: bdot-edge-01
    environment:
      <<: *bdot-env
      OPAMP_AGENT_ID: 01K5GRRC0N0000000000EDGE01
      OPAMP_AGENT_NAME: bdot-edge-01
      OPAMP_LABELS: fleet=grrcon-edge,role=edge,configuration=grrcon-edge
    volumes:
      - bdot-edge-01-storage:/etc/otel/storage
      - ./logs/apache2:/var/log/apache2:ro
      - ./logs/cef:/var/log/cef:ro
    networks:
      bdot-net:
