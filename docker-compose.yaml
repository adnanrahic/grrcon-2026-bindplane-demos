        aliases:
          - bdot-pool

  # Edge collector: tails the native Apache access log that blitz writes to the
  # shared ./logs volume. Not a worker -- it carries no bdot-pool alias, and its
  # configuration ships straight to Elastic rather than through the pool, so the
  # ingress/worker/router path is untouched by this addition.
  bdot-apache:
    <<: *bdot
    container_name: bdot-apache
    hostname: bdot-apache
    environment:
      <<: *bdot-env
      OPAMP_AGENT_ID: 01K5GRRC0N0000000000BD0T11
      OPAMP_AGENT_NAME: bdot-apache
      OPAMP_LABELS: fleet=grrcon-edge,role=edge,configuration=grrcon-apache
    volumes:
      - bdot-apache-storage:/etc/otel/storage
      - ./logs:/logs:ro
    networks:
      - bdot-net

  bdot-cef:
